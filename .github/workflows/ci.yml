# Checks every change, and publishes main to GitHub Pages (gh-pages branch)
# only after the same checks pass.
name: CI

on:
  pull_request:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a run still in progress on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - run: pnpm build
        env:
          # Repository variable; analytics stay off when it is unset.
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}

      # Mobile Lighthouse on the built site: scores, LCP, CLS and byte budgets (lighthouserc.cjs).
      - run: pnpm lighthouse

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 1

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Placeholder copy must never reach production.
      - name: Refuse lorem ipsum in content
        run: |
          if grep -rli "lorem ipsum" src/content 2>/dev/null; then
            echo "Placeholder text found in src/content." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      # Pushes dist/ to the gh-pages branch with the workflow's token
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
